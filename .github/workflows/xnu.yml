name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      sweet_4k:
        description: 4K pages + ARMv8.0 for Cortex-A53 targets (patch 0082)
        default: "false"
  push:
    branches: [main, a02s-4k]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # Read by makedefs/MakeInc.def (patch 0082). Pushes to a02s-4k always build 4K.
  SWEET_4K: ${{ (inputs.sweet_4k == 'true' || github.ref_name == 'a02s-4k') && '1' || '0' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Cortex-A53 flags for libfirehose_kernel
        if: env.SWEET_4K == '1'
        run: |
          # libfirehose_kernel.a is linked into the kernel but built by xcodebuild,
          # outside makedefs: without this it targets apple-m1 and brings LSE atomics.
          # The SWEET kernel only links the plain arm64 slice.
          perl -pi -e 's/(xcodebuild install -target libfirehose_kernel -sdk macosx) ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/$1 ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS=\x27\$(inherited) -mcpu=cortex-a53 -mfix-cortex-a53-835769\x27/' dxb/build.sh
          grep -n 'target libfirehose_kernel' dxb/build.sh
          grep -q 'mcpu=cortex-a53' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Verify 4K build
        if: env.SWEET_4K == '1'
        run: |
          # build.sh only warns when a patch does not apply; a skipped 0082 would
          # silently produce a 16K kernel.
          if grep -n 'Skipping patch.*0082' dxb/build.log; then exit 1; fi
          K=$(ls dxb/fakeroot/System/Library/Kernels/kernel.* | head -1)
          # 4K kernels use the iOS layout (link address 0xfffffff007004000), not -2TB.
          otool -l "$K" | awk '/segname __TEXT$/{f=1} f&&/vmaddr/{print; exit}' | tee vmaddr.txt
          grep -q '0xfffffff007' vmaddr.txt
          # Cortex-A53 is ARMv8.0: no LSE atomics. QEMU may run them anyway,
          # the phone would take an undefined-instruction exception.
          # K256 is the SHA-256 constant table inside __text: data, never executed.
          xcrun objdump -d --no-show-raw-insn --mattr=+lse "$K" |
            awk '/^[0-9a-f]+ <.*>:$/ { fn = $2; next }
                 fn != "<K256>:" && /\t(cas|casa|casl|casal|casp|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|swp|stadd|stclr|steor|stset)[abhl]*\t/ { print fn, $0 }' > lse.txt
          echo "LSE atomics in kernel code: $(wc -l < lse.txt)"
          head -20 lse.txt
          test ! -s lse.txt

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel${{ env.SWEET_4K == '1' && '-4k' || '' }}
          path: out/
          if-no-files-found: warn
